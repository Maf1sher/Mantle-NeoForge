plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
}

group = mod_group_id
base {
    archivesName = 'Mantle'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Preserve the SlimeKnights version suffix used by published artifacts.
task buildInfo {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, projectDir)
        proc.waitFor()
        ext.revision = proc.exitValue() == 0 ? proc.text.trim() : 'GITBORK'
    } catch (Exception ignored) {
        ext.revision = 'gitgud'
    }
    ext.buildNum = System.getenv('BUILD_NUMBER') ?: "DEV.${project.buildInfo.revision}"
}
ext.artifact_version = System.getenv('ARTIFACT_VERSION') ?: "${mod_version}.${project.buildInfo.buildNum}"
version = "${minecraft_version}-${artifact_version}"

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

neoForge {
    version = neoforge_version
    parchment {
        mappingsVersion = parchment_version
        minecraftVersion = parchment_minecraft_version
    }
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true
    addModdingDependenciesTo(sourceSets.test)

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath
        }
    }

    mods {
        create('mantle') {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        version: artifact_version,
        loader_range: loader_range,
        minecraft_range: minecraft_range,
        neoforge_range: neoforge_range,
        jei_range: jei_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('sourcesJar', Jar).configure {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = uri(DEPLOY_DIR) }
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
